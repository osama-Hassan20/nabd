name: eyadty
description: Eyadty - Multi-Branch Clinic & Medical Group SaaS Dashboard
publish_to: none
version: 1.0.3+4
environment:
  sdk: ^3.13.1
dependencies:
  pdf: ^3.11.1
  printing: ^5.13.2
  bloc: ^9.1.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.8.0+1
  dotted_border: ^3.1.0
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  # firebase_core: ^4.11.0
  # firebase_messaging: ^16.4.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.4.2
  flutter_native_splash: ^2.4.6
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  flutter_svg_provider: ^1.0.3
  get_it: ^9.0.5
  go_router: ^17.0.0
  http: ^1.5.0
  http_parser: ^4.1.2
  hugeicons: ^1.1.6
  image: ^4.8.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  path: null
  path_provider: null
  permission_handler: ^12.0.1
  pinput: ^6.0.1
  popover: ^0.4.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  timeago: ^3.7.1
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  url_strategy: ^0.3.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/map_styles/
  fonts:
    - family: madani
      fonts:
        - asset: assets/fonts/madani.ttf
flutter_launcher_icons:
  image_path: assets/images/app_log_wbg.jpg
  android: launcher_icon
  ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_log_wbg.jpg"
    background_color: '#ffffff'
    theme_color: '#ffffff'
  windows:
    generate: true
    image_path: "assets/images/app_log_wbg.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_log_wbg.jpg"
flutter_native_splash:
  color: '#ffffff'
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png

