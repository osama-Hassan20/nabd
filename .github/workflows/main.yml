name: Flutter Build & Deploy to Telegram

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # 1️⃣  Windows Installer (Inno Setup)
  # ─────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.APP_VERSION }}
      app_name: ${{ steps.get_version.outputs.APP_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version & name from pubspec
        id: get_version
        run: |
          $name    = (Select-String -Path pubspec.yaml -Pattern '^name:').Line.Split(':')[1].Trim()
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:').Line.Split(':')[1].Trim().Split('+')[0]
          echo "APP_NAME=$name"       >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Create Inno Setup script
        run: |
          $appName    = "${{ steps.get_version.outputs.APP_NAME }}"
          $appVersion = "${{ steps.get_version.outputs.APP_VERSION }}"
          $exeName    = (Get-ChildItem "build/windows/x64/runner/Release" -Filter "*.exe" | Select-Object -First 1).Name

          New-Item -ItemType Directory -Force -Path installer_output | Out-Null

          $lines = @(
            "[Setup]",
            "AppName=$appName",
            "AppVersion=$appVersion",
            "AppPublisher=My Company",
            "DefaultDirName={autopf}\$appName",
            "DefaultGroupName=$appName",
            "OutputDir=installer_output",
            "OutputBaseFilename=$appName-v$appVersion-setup",
            "Compression=lzma2/ultra64",
            "SolidCompression=yes",
            "WizardStyle=modern",
            "",
            "[Languages]",
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            "",
            "[Tasks]",
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            "",
            "[Files]",
            'Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs',
            "",
            "[Icons]",
            "Name: `"{group}\$appName`"; Filename: `"{app}\$exeName`"",
            "Name: `"{commondesktop}\$appName`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            "",
            "[Run]",
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appName}`"; Flags: nowait postinstall skipifsilent"
          )

          $lines | Out-File -FilePath "setup.iss" -Encoding UTF8
        shell: pwsh

      - name: Build Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer_output/*.exe
          retention-days: 1

  # ─────────────────────────────────────────
  # 2️⃣  Web
  # ─────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (release)
        run: flutter build web --release

      - name: Zip Web build
        run: |
          cd build/web
          zip -r ../../web-release.zip .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: web-release.zip
          retention-days: 1

  # ─────────────────────────────────────────
  # 3️⃣  Send to Telegram
  # ─────────────────────────────────────────
  send-telegram:
    name: Send to Telegram
    runs-on: ubuntu-latest
    needs: [build-windows, build-web]
    if: always()

    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: Download Web ZIP
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: ./artifacts

      - name: List artifacts (debug)
        run: ls -la ./artifacts/

      - name: Send Windows Installer to Telegram
        run: |
          INSTALLER=$(ls ./artifacts/*.exe | head -1)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"$INSTALLER" \
            -F caption="🖥️ *Windows Installer*%0A🏷️ Version: \`${{ needs.build-windows.outputs.app_version }}\`%0A📦 Branch: \`${{ github.ref_name }}\`%0A👤 ${{ github.actor }}" \
            -F parse_mode="Markdown"

      - name: Send Web ZIP to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"./artifacts/web-release.zip" \
            -F caption="🌐 *Web Build*%0A🏷️ Version: \`${{ needs.build-windows.outputs.app_version }}\`%0A📦 Branch: \`${{ github.ref_name }}\`%0A👤 ${{ github.actor }}" \
            -F parse_mode="Markdown"
